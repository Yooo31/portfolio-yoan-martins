name: Weekly release

# Chaque lundi : develop est vérifié par la CI complète, promu sur main, puis release.yml crée la release.
# Vercel déploie la production à chaque nouveau commit sur main.
# Lancement manuel possible : onglet Actions > Weekly release > Run workflow (ou `gh workflow run weekly-release.yml`).
on:
  schedule:
    # 13h00 UTC le lundi : après les PR Dependabot du lundi 9h (Europe/Paris) et leurs fusions automatiques
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  # Les fusions automatiques de Dependabot ne relancent pas la CI sur develop : on vérifie ici le cumul.
  ci:
    uses: ./.github/workflows/ci.yml

  promote:
    name: Promouvoir develop sur main
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Y a-t-il du nouveau sur develop ?
        id: diff
        run: |
          git fetch origin main
          count=$(git rev-list --count origin/main..HEAD)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count commit(s) à promouvoir" >> "$GITHUB_STEP_SUMMARY"

      # main exige une pull request : on en ouvre une et on la fusionne avec un vrai commit de merge
      # (pas de squash), pour que semantic-release voie chaque commit et que main ne diverge pas de develop.
      - name: Fusionner develop dans main
        if: steps.diff.outputs.count != '0'
        run: |
          pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head develop \
              --title "release: promotion hebdomadaire de develop sur main" \
              --body "Promotion automatique (workflow Weekly release). La CI complète est passée sur develop juste avant." \
              | grep -oE '[0-9]+$')
          fi
          gh pr merge "$pr" --merge

      # Un push fait avec GITHUB_TOKEN ne déclenche pas les workflows « on: push » : on lance la release explicitement.
      - name: Lancer la release sur main
        if: steps.diff.outputs.count != '0'
        run: gh workflow run release.yml --ref main
