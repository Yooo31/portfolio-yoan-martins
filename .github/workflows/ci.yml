name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ce job est le contrôle requis sur develop : chaque étape est bloquante.
  # L'auto-merge des PR Dependabot (auto-merge.yml) ne se déclenche que s'il passe.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Security audit (dépendances de production, niveau high et plus)
        run: pnpm run audit:prod

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (export statique, desktop et mobile)
        run: pnpm run test

      - name: Lighthouse CI (seuils dans lighthouserc.js)
        run: pnpm exec lhci collect && pnpm exec lhci assert

      - name: Publier le rapport Lighthouse
        if: always()
        continue-on-error: true
        run: pnpm exec lhci upload

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
